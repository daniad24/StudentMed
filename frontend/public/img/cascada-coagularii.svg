ed" stroke-width="3"  marker-end="url(#a7c3aed)"/><rect x="170" y="394" width="240" height="44" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="290.0" y="420.9" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Protrombină → trombină</text><line x1="290" y1="440" x2="290" y2="480" stroke="#7c3aed" stroke-width="3"  marker-end="url(#a7c3aed)"/><rect x="170" y="482" width="240" height="44" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="290.0" y="508.9" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#111827" text-anchor="middle">Fibrinogen → fibrină</text><circle cx="200" cy="70" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="200" y="75.5" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#92400e" text-anchor="middle">B</text><circle cx="552" cy="112" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="552" y="117.5" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#92400e" text-anchor="middle">A</text><circle cx="180" cy="330" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="180" y="335.5" font-family="Arial,sans-serif" font-size="15" font-weight="800" fill="#92400e" text-anchor="middle">C</text><text x="290" y="556" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#374151" text-anchor="middle">Literele marchează cele trei porțiuni ale cascadei</text>
